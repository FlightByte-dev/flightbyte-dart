# Publishes to pub.dev when a tag like v0.1.1 is pushed.
# One-time setup on pub.dev: package Admin tab > Automated publishing >
# enable GitHub Actions, repository <owner>/flightbyte-dart, tag pattern v{{version}}.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
