name: Bug report
description: Something in the package does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A question about the API itself, your plan or a flight's data is answered faster on [Telegram](https://t.me/flightbyte). A security issue goes by email, as [SECURITY.md](https://github.com/FlightByte-dev/flightbyte-dart/security/policy) explains, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that shows it
      description: The smallest snippet that reproduces it, and the full exception or stack trace.
      render: dart
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '1.0.0'
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: Dart or Flutter version
      description: The first line of `dart --version` or `flutter --version`.
      placeholder: Dart SDK version 3.11.5 (stable)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where it runs
      multiple: true
      options:
        - Flutter on iOS
        - Flutter on Android
        - Flutter web
        - Flutter desktop
        - Dart server or CLI
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: For an error from the API, `FlightByteApiException.requestId`. It lets us find the request in our logs.
  - type: checkboxes
    id: secrets
    attributes:
      label: Before you submit
      options:
        - label: I removed every API key and webhook signing secret from this report.
          required: true
